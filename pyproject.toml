
[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moment"
version = "0.1.0"
description = "Personal Python utilities for machine learning and research"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Yiqi Sun" },
]
keywords = [
    "pytorch",
]
dependencies = [
    "torch>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
